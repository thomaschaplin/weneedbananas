# Exercises the Actioneer Kubernetes runner features on the local cluster:
# the default warm pool, the `large` runner class and per-project secrets.
name: Warm pool demo
description: Jobs that start on warm runner pods and read this project's secret.

on:
  manual: {}

jobs:
  default-warm:
    # No container: or runner:, so an idle pod from the default warm pool takes it.
    steps:
      - name: where am I
        run: |
          echo "pod: $(hostname)"
          nproc
      - name: project secret
        run: |
          if [ "${{ secrets.PROJECT_SECRET }}" = "from-weneedbananas" ]; then
            echo "PROJECT_SECRET is weneedbananas's own value"
          else
            echo "PROJECT_SECRET is not weneedbananas's value"; exit 1
          fi

  large-warm:
    # The large class's warm pool keeps one pod with 2 CPU / 2Gi ready.
    runner: large
    steps:
      - name: where am I
        run: |
          echo "pod: $(hostname)"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
